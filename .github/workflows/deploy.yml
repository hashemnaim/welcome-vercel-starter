name: Quality Checks and Deploy Main Website

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build:static

      - name: Verify build output
        run: test -f dist/index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build:static

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing GitHub secret: VPS_HOST" && exit 1)
          test -n "$VPS_USER" || (echo "Missing GitHub secret: VPS_USER" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "Missing GitHub secret: VPS_SSH_KEY" && exit 1)

      - name: Test VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: timeout 5 bash -c "</dev/tcp/${VPS_HOST}/2228"

      - name: Deploy build to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: 2228
          SOURCE: "dist/"
          TARGET: "/var/www/shoplanser/dist"
          ARGS: "-rlDzvc --delete"
