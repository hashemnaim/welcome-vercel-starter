name: Deploy Main Website to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build:static

      - name: Verify build output
        run: test -f dist/index.html

      - name: Test VPS connection
        run: |
          echo "Testing port 22"
          timeout 5 bash -c "</dev/tcp/${{ secrets.VPS_HOST }}/22" && echo "OK 22" || echo "FAIL 22"

          echo "Testing port 2228"
          timeout 5 bash -c "</dev/tcp/${{ secrets.VPS_HOST }}/2228" && echo "OK 2228" || echo "FAIL 2228"

      - name: Deploy build to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: 2228
          SOURCE: "dist/"
          TARGET: "/var/www/shoplanser/dist"
          ARGS: "-rlDzvc --delete"
