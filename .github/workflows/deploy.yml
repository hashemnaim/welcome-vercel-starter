name: Quality Checks and Deploy Main Website

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build:static

      - name: Verify build output
        run: test -f dist/index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check VPS deployment configuration
        id: vps_config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "VPS deployment is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS deployment skipped because VPS_HOST, VPS_USER, and/or VPS_SSH_KEY are not configured. Vercel deployment is unaffected."
          fi

      - name: Checkout code
        if: steps.vps_config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.vps_config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        if: steps.vps_config.outputs.configured == 'true'
        run: npm install

      - name: Build app
        if: steps.vps_config.outputs.configured == 'true'
        run: npm run build:static

      - name: Test VPS connection
        if: steps.vps_config.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: timeout 5 bash -c "</dev/tcp/${VPS_HOST}/2228"

      - name: Deploy build to VPS
        if: steps.vps_config.outputs.configured == 'true'
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: 2228
          SOURCE: "dist/"
          TARGET: "/var/www/shoplanser/dist"
          ARGS: "-rlDzvc --delete"
