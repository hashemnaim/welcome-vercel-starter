name: Format Vendor Apply V2

on:
  push:
    branches:
      - preview
    paths:
      - src/pages/VendorApplyV2.tsx
      - .github/workflows/format-vendor-apply-v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Format vendor onboarding
        run: npx prettier --write src/pages/VendorApplyV2.tsx

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/pages/VendorApplyV2.tsx; then
            echo "Vendor onboarding is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/VendorApplyV2.tsx
          git commit -m "Format vendor onboarding page"
          git push origin HEAD:preview
